<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="manifest" href="/manifest.json">

  <title>Arqueologia Radar</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17212b;
      background: #f3f6f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      background: #17324d;
      color: #fff;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 0 16px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .sub {
      opacity: .8;
      margin-top: 4px;
    }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      margin: 18px 0;
    }

    input,
    select,
    button {
      font: inherit;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #ccd5de;
    }

    button {
      background: #17324d;
      color: #fff;
      border: 0;
      font-weight: 700;
    }

    .status,
    .card,
    .diagnostics {
      background: #fff;
      border-radius: 16px;
      padding: 15px;
      margin: 12px 0;
      box-shadow: 0 2px 10px #0001;
    }

    .title {
      font-weight: 750;
      font-size: 18px;
    }

    .meta {
      color: #66727e;
      margin: 7px 0;
    }

    .badge {
      display: inline-block;
      background: #e7eef5;
      border-radius: 8px;
      padding: 5px 8px;
      margin: 3px;
      font-size: 12px;
    }

    .score {
      float: right;
      font-weight: 800;
    }

    .sources {
      columns: 2;
    }

    .sources a {
      display: block;
      margin: 8px 0;
      color: #075a9f;
      text-decoration: none;
    }

    .diag {
      padding: 8px 0;
    }

    .diag.ok {
      color: #176b35;
    }

    .diag.error,
    .red {
      color: #b42318;
    }

    .empty {
      text-align: center;
    }

    @media(max-width:750px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .controls input,
      .controls button {
        grid-column: 1/-1;
      }

      .sources {
        columns: 1;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="wrap">
      <h1>🏺 Arqueologia Radar</h1>
      <div class="sub">
        Pesquisa manual internacional — sem emails e sem pesquisa em segundo plano
      </div>
    </div>
  </header>

  <main class="wrap">

    <div class="controls">

      <input
        id="q"
        value="archaeology"
        placeholder="archaeology, heritage, excavation..."
      >

      <select id="region">
        <option value="">Todas as regiões</option>
        <option>Europa</option>
        <option>África</option>
        <option>Médio Oriente</option>
        <option>Américas</option>
        <option>Ásia-Pacífico</option>
      </select>

      <select id="category">
        <option value="">Todas as categorias</option>
        <option>Arqueologia direta</option>
        <option>Património cultural</option>
        <option>Grande projeto / potencial subcontratação</option>
      </select>

      <button id="go">
        🔎 PESQUISAR AGORA
      </button>

    </div>

    <div id="status" class="status">
      A pesquisa só começa quando carregares no botão.
    </div>

    <div id="diagnostics"></div>

    <div id="results"></div>

  </main>

  <script src="/app.js"></script>

</body>
</html>
